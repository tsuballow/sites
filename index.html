<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>poriri.com</title>
  <style>
    :root {
      --bg: #02030a;
      --cyan: #00f7ff;
      --pink: #ff2bd6;
      --violet: #7b2cff;
      --white: #effcff;
      --panel: rgba(255, 255, 255, 0.055);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 247, 255, 0.13), transparent 24rem),
        radial-gradient(circle at 18% 22%, rgba(255, 43, 214, 0.16), transparent 18rem),
        radial-gradient(circle at 82% 78%, rgba(123, 44, 255, 0.16), transparent 20rem),
        linear-gradient(145deg, #010106 0%, var(--bg) 42%, #060015 100%);
      color: var(--white);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      z-index: -3;
      background-image:
        linear-gradient(rgba(0, 247, 255, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 247, 255, 0.12) 1px, transparent 1px);
      background-size: clamp(28px, 4vw, 56px) clamp(28px, 4vw, 56px);
      mask-image: radial-gradient(ellipse at center, black 0 42%, transparent 78%);
      transform: perspective(620px) rotateX(64deg) translateY(22%);
      transform-origin: center bottom;
      animation: grid-drift 9s linear infinite;
    }

    body::after {
      z-index: -2;
      background:
        linear-gradient(transparent 48%, rgba(255, 255, 255, 0.035) 50%, transparent 52%) 0 0 / 100% 4px,
        radial-gradient(circle at center, transparent 0 38%, rgba(0, 0, 0, 0.56) 100%);
      mix-blend-mode: screen;
    }

    .stage {
      width: min(92vw, 980px);
      aspect-ratio: 2.45 / 1;
      min-height: 280px;
      display: grid;
      place-items: center;
      position: relative;
      border: 1px solid rgba(0, 247, 255, 0.22);
      border-radius: clamp(22px, 4vw, 44px);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02)),
        var(--panel);
      box-shadow:
        0 0 0 1px rgba(255, 43, 214, 0.13) inset,
        0 0 42px rgba(0, 247, 255, 0.14),
        0 0 110px rgba(123, 44, 255, 0.16),
        0 34px 100px rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(24px) saturate(150%);
      overflow: hidden;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: inherit;
      pointer-events: none;
    }

    .stage::before {
      border: 1px solid rgba(255, 255, 255, 0.1);
      clip-path: polygon(0 0, 26% 0, 26% 1px, 74% 1px, 74% 0, 100% 0, 100% 100%, 68% 100%, 68% calc(100% - 1px), 32% calc(100% - 1px), 32% 100%, 0 100%);
    }

    .stage::after {
      inset: -45%;
      background:
        conic-gradient(from 0deg, transparent 0deg, rgba(0, 247, 255, 0.15) 62deg, transparent 118deg, rgba(255, 43, 214, 0.12) 178deg, transparent 238deg, rgba(123, 44, 255, 0.13) 300deg, transparent 360deg);
      animation: halo-spin 14s linear infinite;
      z-index: -1;
    }

    .mark {
      position: relative;
      margin: 0;
      font-size: clamp(3.1rem, 10vw, 8.6rem);
      line-height: 0.92;
      letter-spacing: -0.065em;
      font-weight: 900;
      color: transparent;
      background:
        linear-gradient(90deg, #ffffff 0%, #bfffff 28%, var(--cyan) 48%, #ffe6fb 64%, var(--pink) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow:
        0 0 16px rgba(0, 247, 255, 0.4),
        0 0 34px rgba(255, 43, 214, 0.25),
        0 0 80px rgba(123, 44, 255, 0.18);
      filter: drop-shadow(0 0 22px rgba(0, 247, 255, 0.22));
      animation: pulse 3.8s ease-in-out infinite;
      user-select: none;
      white-space: nowrap;
    }

    .mark::before,
    .mark::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: transparent;
      background: inherit;
      -webkit-background-clip: text;
      background-clip: text;
      opacity: 0.68;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .mark::before {
      transform: translate(-0.035em, -0.018em);
      text-shadow: 0 0 16px rgba(0, 247, 255, 0.85);
      clip-path: polygon(0 8%, 100% 8%, 100% 23%, 0 23%, 0 42%, 100% 42%, 100% 52%, 0 52%);
      animation: glitch-a 2.6s steps(2, end) infinite;
    }

    .mark::after {
      transform: translate(0.032em, 0.018em);
      text-shadow: 0 0 16px rgba(255, 43, 214, 0.85);
      clip-path: polygon(0 62%, 100% 62%, 100% 72%, 0 72%, 0 84%, 100% 84%, 100% 94%, 0 94%);
      animation: glitch-b 3.1s steps(2, end) infinite;
    }

    .orb {
      position: absolute;
      width: clamp(160px, 22vw, 310px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.75;
      pointer-events: none;
    }

    .orb.one {
      left: -10%;
      top: -26%;
      background: radial-gradient(circle, rgba(0, 247, 255, 0.26), transparent 66%);
      animation: float-one 8s ease-in-out infinite;
    }

    .orb.two {
      right: -12%;
      bottom: -30%;
      background: radial-gradient(circle, rgba(255, 43, 214, 0.25), transparent 68%);
      animation: float-two 9s ease-in-out infinite;
    }

    .line {
      position: absolute;
      left: 50%;
      bottom: clamp(32px, 7vw, 66px);
      width: min(64%, 520px);
      height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(0, 247, 255, 0.84), rgba(255, 43, 214, 0.74), transparent);
      box-shadow: 0 0 22px rgba(0, 247, 255, 0.6);
      opacity: 0.85;
    }

    .line::before {
      content: "";
      position: absolute;
      top: -2px;
      left: 0;
      width: 18%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      filter: blur(2px);
      animation: scan 3.4s ease-in-out infinite;
    }

    @keyframes grid-drift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 0 56px, 56px 0; }
    }

    @keyframes halo-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 247, 255, 0.24)); }
      50% { filter: drop-shadow(0 0 36px rgba(255, 43, 214, 0.3)); }
    }

    @keyframes glitch-a {
      0%, 88%, 100% { transform: translate(-0.035em, -0.018em); opacity: 0.42; }
      89%, 93% { transform: translate(0.035em, -0.01em); opacity: 0.9; }
      94%, 97% { transform: translate(-0.018em, 0.025em); opacity: 0.55; }
    }

    @keyframes glitch-b {
      0%, 84%, 100% { transform: translate(0.032em, 0.018em); opacity: 0.38; }
      85%, 90% { transform: translate(-0.03em, 0.01em); opacity: 0.88; }
      91%, 95% { transform: translate(0.018em, -0.024em); opacity: 0.58; }
    }

    @keyframes float-one {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(12%, 15%, 0) scale(1.12); }
    }

    @keyframes float-two {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-11%, -13%, 0) scale(1.1); }
    }

    @keyframes scan {
      0%, 100% { transform: translateX(0); opacity: 0; }
      18%, 82% { opacity: 1; }
      50% { transform: translateX(455%); }
    }

    @media (max-width: 700px) {
      .stage {
        width: min(90vw, 480px);
        aspect-ratio: 0.86 / 1;
        min-height: 440px;
        border-radius: 30px;
      }

      .mark {
        font-size: clamp(3rem, 16vw, 5.8rem);
        letter-spacing: -0.075em;
        transform: translateY(-0.06em);
      }

      .line {
        width: 68%;
        bottom: 90px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="poriri.com">
    <div class="orb one" aria-hidden="true"></div>
    <div class="orb two" aria-hidden="true"></div>
    <h1 class="mark" data-text="poriri.com">poriri.com</h1>
    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
